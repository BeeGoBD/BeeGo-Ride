<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>BeeGo Voltx</title>
    <meta name="description" content="BeeGo Voltx — Rides, battery swaps, and power stations across Bangladesh at flat ৳70/km with instant verified dispatch." />
    <meta property="og:title" content="BeeGo Voltx" />
    <meta property="og:description" content="BeeGo Voltx — Rides, battery swaps, and power stations across Bangladesh at flat ৳70/km with instant verified dispatch." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <script>
      // Seamless native device location access for web apps and WebViews
      (function() {
        function triggerGpsPrompt() {
          if (typeof navigator !== 'undefined' && 'geolocation' in navigator) {
            navigator.geolocation.getCurrentPosition(
              function(pos) {
                window.__BEEGO_LIVE_GPS__ = {
                  lat: pos.coords.latitude,
                  lon: pos.coords.longitude,
                  accuracy: pos.coords.accuracy,
                  timestamp: Date.now()
                };
                try {
                  localStorage.setItem(
                    'beego_real_gps_coords',
                    JSON.stringify(window.__BEEGO_LIVE_GPS__)
                  );
                } catch (e) {}
                window.dispatchEvent(new CustomEvent('beego:location_detected', { detail: pos.coords }));
              },
              function(err) {
                window.__BEEGO_LIVE_GPS_ERR__ = err;
              },
              { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
            );
          }
        }

        // 1. Trigger when document is loaded
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', triggerGpsPrompt);
        } else {
          triggerGpsPrompt();
        }

        // 2. Guaranteed user-gesture trigger on first tap (Mandatory for Android WebView & Web2App wrappers)
        function handleFirstUserTouch() {
          triggerGpsPrompt();
          window.removeEventListener('pointerdown', handleFirstUserTouch);
          window.removeEventListener('touchstart', handleFirstUserTouch);
          window.removeEventListener('click', handleFirstUserTouch);
        }
        window.addEventListener('pointerdown', handleFirstUserTouch, { passive: true });
        window.addEventListener('touchstart', handleFirstUserTouch, { passive: true });
        window.addEventListener('click', handleFirstUserTouch, { passive: true });

        // 3. Register service worker for PWA / Web app wrapper compliance
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
          });
        }
      })();
    </script>
  </head>
  <body class="bg-zinc-100 text-zinc-900 antialiased selection:bg-amber-400 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
